plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One source tree, many Minecraft versions. Build a specific one with
//   ./gradlew build -PmcVersion=1.21.11
// or all of them with ./buildAll.sh. Each target pins the Voxy build by Modrinth
// version *id*, since the same version number is published for several MC versions.
def TARGETS = [
        "26.2"   : [loader: "0.19.3", fapi: "0.158.0+26.2", voxy: "zZX86mbc",
                    sodium: "mc26.2-0.9.2-alpha.4-fabric", java: 25, mcDepend: "~26.2"],
        "26.1.2" : [loader: "0.19.3", fapi: "0.155.2+26.1.2", voxy: "Zt3LPI0b",
                    sodium: "mc26.1.2-0.9.2-alpha.4-fabric", java: 25, mcDepend: "~26.1.2"],
]
// 1.21.x is deliberately absent. The source is portable to it -- Voxy's storage API is
// identical there and StoreAccess looks its render system up reflectively for exactly
// that reason -- but the toolchain is not. Fabric API for 1.21.x ships access wideners
// in the intermediary namespace, and Loom 1.16 (required for 26.x) both expects the
// official namespace and has dropped the modImplementation configurations that used to
// remap them. Adding 1.21.x means a second Loom generation, not another row here.

def mcVersion = project.findProperty("mcVersion") ?: project.minecraft_version
def target = TARGETS[mcVersion as String]
if (target == null) {
    throw new GradleException("Unsupported mcVersion '${mcVersion}'. Known: ${TARGETS.keySet().join(', ')}")
}

version = "${project.mod_version}+mc${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${target.loader}"
    // Only the two modules we actually use, rather than the whole of Fabric API.
    // The monolithic artifact drags in modules whose access wideners are still in the
    // intermediary namespace on 1.21.x, which Loom rejects when the project is on
    // official mappings (it fails on fabric-biome-api-v1 before compilation starts).
    implementation fabricApi.module("fabric-command-api-v2", target.fapi)
    implementation fabricApi.module("fabric-lifecycle-events-v1", target.fapi)
    // DebugScreenEntries.register is private in vanilla; this module is what widens it,
    // for us and for Voxy alike. It is why the mod requires Fabric API at runtime rather
    // than merely at build time.
    implementation fabricApi.module("fabric-transitive-access-wideners-v1", target.fapi)

    // Voxy is All-Rights-Reserved ("Do not redistribute"). It is resolved from the
    // Modrinth maven for compilation and dev runtime only, and is never bundled into
    // our jar -- see README.
    compileOnly "maven.modrinth:voxy:${target.voxy}"
    runtimeOnly "maven.modrinth:voxy:${target.voxy}"

    // Voxy hard-depends on Sodium, and its own config UI is registered through
    // Sodium's config API, so we need it on the compile classpath too.
    implementation "maven.modrinth:sodium:${target.sodium}"

    // Voxy bundles RocksDB; we only compile against the API to read size properties
    // and trigger compaction. Never bundled.
    compileOnly "org.rocksdb:rocksdbjni:9.7.3"
}

def targetJavaVersion = target.java
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_depend", target.mcDepend
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_depend": target.mcDepend
    }
}
