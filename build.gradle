plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Voxy is All-Rights-Reserved ("Do not redistribute"). It is resolved from the
    // Modrinth maven for compilation and dev runtime only, and is never bundled into
    // our jar -- see README.
    compileOnly "maven.modrinth:voxy:${project.voxy_version}"
    runtimeOnly "maven.modrinth:voxy:${project.voxy_version}"

    // Voxy hard-depends on Sodium, and its own config UI is registered through
    // Sodium's config API, so we need it on the compile classpath too.
    implementation "maven.modrinth:sodium:${project.sodium_version}"

    // Voxy bundles RocksDB; we only compile against the API to read size properties
    // and trigger compaction. Never bundled.
    compileOnly "org.rocksdb:rocksdbjni:9.7.3"
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
